<!DOCTYPE html>
<html lang="el">
<head>
     <meta charset="UTF-8">
     <title>Ένα μικρό μυστήριο</title>

     <style>
          body {
    background-color: #b58bd4;
    text-align: center;
    font-family: "Trebuchet MS", sans-serif;
    padding-top:80px;
}  
          button {
    background-color: #8e5bb7;
    color: white;
    border: none;
    padding: 12px 24px;
    border-radius: 25px;
    font-family: "Trebuchet MS", sans-serif;
    font-size: 16px;
    cursor: pointer;
    margin-top: 20px;
}

button:hover {
    background-color: #75449d;
}

.hidden-message {
    display: none;
    margin-top: 25px;
    font-size: 18px;
}
 
 .container {
            background-color: rgba(255, 255, 255, 0.25);
            padding: 40px;
            border-radius: 20px;
            width: 60%;
            margin: auto;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
}
 h1 {
            font-size: 32px;
            font-weight: normal;
}

 p {
            font-size: 18px;
            line-height: 1.8;
 }

 hr {
            width: 100px;
            border: none;
            border-top: 1px solid rgba(0, 0, 0, 0.3);
            margin: 25px auto;
 }


 .signature {
            position: fixed;
            bottom: 20px;
            left: 25px;
            font-family: Georgia, serif;
            font-size: 18px;
            font-style: italic;
}

    
    </style>
</head>

<body>
     <div class="container">
     <button onclick="showMessage()">Πάτα εδώ...</button>

<p id="secretMessage" class="hidden-message">
    Είσαι λίγα click μακριά...
</p>   

     <h1>Έχεις βρει την αρχή.</h1>

  <hr>
     <p>Αλλά πρέπει να ψάξεις λίγο καλύτερα...</p>
     <p>Ίσως εκεί που <u>εσύ</u> δεν βλέπεις.</p>
     <p>🗝️</p>
 
     <!-- Μπράβο αν έφτασες μέχρι εδώ -->
     <!-- Μάλλον θα σου φαίνεται γνώριμο αυτό που βλέπεις ή... και όχι. -->

     <!-- Προσπάθησε να ξεκινήσεις λίγο αντίστροφα από αυτό που σκέφτηκες -->
     <!-- 5 18 / 24 16 1 3 1 / 20 11 15 16 -->
     <!--🤍-->
     
     <div class="signature">Φ</div>




</body>
     <script>
    function showMessage() {
        document.getElementById("secretMessage").style.display = "block";
    }
</script>
</html>
